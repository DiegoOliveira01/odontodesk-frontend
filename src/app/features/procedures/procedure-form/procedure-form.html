<div class="page">

  <div class="page__header">
    <h2>{{ isEditMode() ? 'Editar Procedimento' : 'Novo Procedimento' }}</h2>
    <a routerLink="/procedures">Voltar</a>
  </div>

  @if (errorMessage()) {
    <div class="form-error-box">
      {{ errorMessage() }}
    </div>
  }

  @if (isLoading()) {
    <p>Carregando...</p>
  } @else {

    <form [formGroup]="procedureForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="name">Nome *</label>
        <input id="name" type="text" formControlName="name" />
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <input id="description" type="text" formControlName="description" />
      </div>

      <div class="form-group">
        <label for="estimatedDurationMinutes">Duração estimada (minutos)</label>
        <input id="estimatedDurationMinutes" type="number" formControlName="estimatedDurationMinutes" />
      </div>

      <div class="form-group">
        <label for="price">Preço (R$)</label>
        <input id="price" type="number" step="0.01" formControlName="price" />
      </div>

      <button type="submit" [disabled]="isLoading()">
        {{ isEditMode() ? 'Salvar Alterações' : 'Criar Procedimento' }}
      </button>

    </form>

  }

</div>
