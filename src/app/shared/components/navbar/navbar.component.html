<header class="h-16 bg-white border-b border-app-border flex items-center justify-between px-6">

  <h1 class="font-display font-bold text-xl text-ink">{{ pageTitle() }}</h1>

  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block">
      <p class="text-xs font-semibold text-primary-600 uppercase tracking-wide">
        {{ userRole() }}
      </p>
      <p class="text-sm text-gray-500">{{ userEmail() }}</p>
    </div>
    <div class="w-9 h-9 rounded-full bg-primary-500 text-white flex items-center justify-center font-semibold text-sm">
      {{ userEmail()?.charAt(0)?.toUpperCase() }}
    </div>
  </div>

</header>
